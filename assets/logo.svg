<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f72585;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f75da8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Film strip outer frame -->
  <rect x="10" y="10" width="80" height="80" rx="8" fill="url(#logoGradient)" filter="url(#glow)"/>

  <!-- Film strip holes (top) -->
  <rect x="15" y="15" width="8" height="8" rx="2" fill="#0a0a1a" opacity="0.6"/>
  <rect x="40" y="15" width="8" height="8" rx="2" fill="#0a0a1a" opacity="0.6"/>
  <rect x="65" y="15" width="8" height="8" rx="2" fill="#0a0a1a" opacity="0.6"/>

  <!-- Film strip holes (bottom) -->
  <rect x="15" y="77" width="8" height="8" rx="2" fill="#0a0a1a" opacity="0.6"/>
  <rect x="40" y="77" width="8" height="8" rx="2" fill="#0a0a1a" opacity="0.6"/>
  <rect x="65" y="77" width="8" height="8" rx="2" fill="#0a0a1a" opacity="0.6"/>

  <!-- Center play button -->
  <circle cx="50" cy="50" r="20" fill="#0a0a1a" opacity="0.3"/>
  <polygon points="44,40 44,60 62,50" fill="white" opacity="0.9"/>

  <!-- Sparkle effect -->
  <circle cx="75" cy="25" r="3" fill="white" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="25" cy="75" r="2" fill="white" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
